[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "those-who-run"
# The version is __version__ in src/those_who_run/__init__.py, its one home.
dynamic = ["version"]
description = "Those Who Run (走り屋): self-hosted voice race engineer for Gran Turismo 7. PS5 telemetry in, rule-based callouts, Piper TTS, Discord voice out"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.14"
authors = [{ name = "Ciarán Roche" }]
# The core: what the pit wall's data API (`those-who-run pitwall`) imports, and all
# the slim pitwall image installs (#237, ADR 0003 point 7).
dependencies = [
  "pyyaml>=6",
  "duckdb>=1.1",
  "aiohttp>=3.9,<4",  # the HTTP servers (server.py, pitwall/server.py); discord.py needs it too
]

[project.optional-dependencies]
# The race engineer (`run`, `record`, `say`, `post`, `replay`): telemetry, Discord,
# Piper and metrics. The engineer's image and `make venv` install it.
engineer = [
  "gt-telem==1.2.1",  # exact: telemetry.py uses its private attributes
  "discord.py[voice]>=2.4,<3",
  "piper-tts>=1.3",
  "prometheus-client>=0.21",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit>=4.6",
  # make workflow-lint: exact, so a new audit arrives as a Dependabot PR, not as a red CI.
  "zizmor==1.31.1",
  "actionlint-py==1.7.12.25",
  "shellcheck-py==0.11.0.1",  # actionlint checks run: steps with it, the same locally as in CI
]

[project.scripts]
those-who-run = "those_who_run.cli:main"

[tool.hatch.version]
path = "src/those_who_run/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/those_who_run"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# An expected failure that passes fails the run: the xfail comes off (#358).
xfail_strict = true
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/those_who_run"]

[tool.coverage.report]
# The floor `make check` enforces. Raise it as coverage climbs; never lower it.
fail_under = 90
skip_covered = true
show_missing = true

[tool.mypy]
python_version = "3.14"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# No type information shipped: gt-telem has no py.typed, pandas needs pandas-stubs.
module = ["gt_telem", "gt_telem.*", "pandas", "pandas.*"]
ignore_missing_imports = true
