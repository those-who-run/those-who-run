name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv installs the Python in .python-version and the packages in uv.lock.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
          enable-cache: true
      - run: make venv
      # The same command as locally: lint, mypy, and tests with the coverage floor.
      # Tests that replay an archived outing fetch it from the `outings` release
      # with gh (ADR 0002), which needs a token; without one they skip, and a skip
      # fails make check.
      - run: make check
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: muldoon/those-who-run:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts and both of its modes parse: what the release checks too.
      - name: Smoke test the image
        run: |
          docker run --rm muldoon/those-who-run:ci --version
          docker run --rm muldoon/those-who-run:ci web --help > /dev/null
