[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gt7-race-engineer"
version = "0.1.0"
description = "Self-hosted voice race engineer for Gran Turismo 7: PS5 telemetry, rule-based callouts, Piper TTS, Discord voice"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
authors = [{ name = "Ciarán Roche" }]
dependencies = [
  "gt-telem>=1.2,<2",
  "discord.py[voice]>=2.4,<3",
  "piper-tts>=1.3",
  "prometheus-client>=0.21",
  "pyyaml>=6",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
gt7-race-engineer = "gt7_race_engineer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gt7_race_engineer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
