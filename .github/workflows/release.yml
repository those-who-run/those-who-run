name: Release

# The one way an image is published. It must pass make check, match the package
# version and run, before anything is pushed. Three ways in, the same jobs:
#   workflow_call      from release-please.yml, right after merging the release PR
#                      created the v* tag and the GitHub release. A tag created with
#                      the Actions token starts no workflow, so the push trigger never
#                      fires for it and nothing runs twice.
#   push v* tag        a tag pushed by hand: release candidates (v0.7.0-rc1).
#   workflow_dispatch  repeats the release of a tag that has a GitHub release, with
#                      this file as it is on the branch dispatched from, not as it was
#                      at the tag. A re-run, or a re-pushed tag, runs the workflow
#                      the tag's commit holds, so it can't get past a fault in this
#                      file; this can (#315): `gh workflow run release.yml -f tag=v0.7.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The v* tag to release again (it must have a GitHub release).
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: The v* tag release-please created.
        required: true
        type: string
    # The caller passes them by name (release-please.yml); the values come
    # from the `release` environment, which publish names and only main and v* tags
    # can use.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# Least privilege: the image goes to Docker Hub with its own secrets, so the
# GITHUB_TOKEN only reads the repository; publish alone adds what attestations
# need (id-token, attestations).
permissions:
  contents: read

# One release per tag at a time, never cancelled half-pushed. Both ways in share
# the group, keyed on the tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Actions are pinned by commit SHA (the tag in the comment): this job holds the
# Docker Hub credentials, so a moved tag must not run with them. Dependabot bumps them.
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
      package: ${{ steps.v.outputs.package }}
    steps:
      # By hand, only a v* tag that release-please (or a person) already released.
      - name: The tag has a release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v*) ;; *) echo "::error::$TAG is not a v* tag"; exit 1;; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null \
            || { echo "::error::$TAG has no GitHub release"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
          enable-cache: false # a release does not read caches other runs wrote
      - run: make venv
      # Fails unless the tag is v + __version__; says whether `latest` moves.
      - name: Tag matches the package version
        id: v
        run: .venv/bin/python scripts/release_version.py "$TAG"
      # make check runs web-check (#237): the Node in web/.node-version and the
      # Playwright browser, as in CI but with no cache (#315).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Install the Playwright browser
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # As in CI: archived-outing tests fetch from those-who-run/outings' outings release with gh
      # (ADR 0002), which needs a token (contents: read); a skip fails make check.
      # zizmor runs offline here: its online audits (known-vulnerable actions,
      # impostor commits) gate PRs in CI, and an advisory published after the
      # release PR went green must not stop the publish.
      - run: make check
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_OFFLINE: "true"

  publish:
    runs-on: ubuntu-latest
    needs: check
    # The Docker Hub token lives only here: main and v* tags, never a PR.
    environment: release
    # Attestations (#356): the OIDC token Sigstore signs with, and the write to
    # this repository's attestations. No other job has either.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      IMAGE: muldoon/those-who-run
      VERSION: ${{ needs.check.outputs.version }}
      PACKAGE: ${{ needs.check.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: those-who-run:smoke
      - name: Smoke test the image
        run: |
          docker run --rm those-who-run:smoke --version | tee /dev/stderr | grep -F " $PACKAGE"
          scripts/smoke-no-web-extra.sh those-who-run:smoke
      # The pit wall's image (ADR 0003 point 7): the data API and the web app.
      - name: Build the pit wall
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: pitwall
          platforms: linux/amd64
          load: true
          tags: those-who-run:smoke-pitwall
      - name: Smoke test the pit wall
        run: |
          docker run --rm those-who-run:smoke-pitwall --version | grep -F " $PACKAGE"
          scripts/smoke-pitwall.sh those-who-run:smoke-pitwall
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The same build again, from this job's own layers (no Actions cache: nothing
      # another run wrote goes into a published image), pushed. `latest` only for a final release.
      # BuildKit attaches its SLSA provenance and an SPDX SBOM to the image index;
      # the SBOM is attested below too.
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ needs.check.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
      # The pit wall next to it, <version>-pitwall (ADR 0001 point 5, amended by ADR
      # 0003). No `latest`: a deployment pins the version it runs.
      - name: Push the pit wall
        id: push-pitwall
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: pitwall
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-pitwall
      # Signed attestations for both images (#356), by digest, stored in this
      # repository and pushed to Docker Hub next to the image: build provenance
      # (this workflow, this commit) and the SBOM BuildKit made. Anyone can check
      # them: gh attestation verify oci://docker.io/muldoon/those-who-run:<version>
      # -R those-who-run/those-who-run (README, Releasing). No storage record: it
      # would need artifact-metadata: write, for an org view nothing here uses.
      - name: The SBOMs, from the pushed images
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          DIGEST_PITWALL: ${{ steps.push-pitwall.outputs.digest }}
        run: |
          sbom() {
            docker buildx imagetools inspect "docker.io/$IMAGE@$2" \
              --format '{{ json .SBOM.SPDX }}' > "$1"
            jq -e '.spdxVersion' "$1" # fails on an image without one (null)
          }
          sbom sbom.spdx.json "$DIGEST"
          sbom sbom-pitwall.spdx.json "$DIGEST_PITWALL"
      - name: Attest the image's provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the pit wall's provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push-pitwall.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the pit wall's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push-pitwall.outputs.digest }}
          sbom-path: sbom-pitwall.spdx.json
          push-to-registry: true
          create-storage-record: false
