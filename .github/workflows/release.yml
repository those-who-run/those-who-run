name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: the image goes to Docker Hub with its own secrets, so the
# GITHUB_TOKEN only reads the repository.
permissions:
  contents: read

# One release per tag at a time, never cancelled half-pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned by commit SHA (the tag in the comment): this job holds the
# Docker Hub credentials, so a moved tag must not run with them. Dependabot bumps them.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            muldoon/those-who-run:${{ steps.v.outputs.version }}
            muldoon/those-who-run:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
