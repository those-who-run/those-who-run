name: Release PR

# Merged PRs collect in one release PR, `chore(release): x.y.z`, that release-please
# keeps up to date on every push to main: the next version, CHANGELOG.md, and the
# version strings in src/those_who_run/__init__.py and the docs. This workflow runs
# CI on it; the maintainer merges it by hand, and that merge is the decision to
# ship. Close or edit it to hold a release back. The run on the merge tags the
# merge commit vx.y.z, creates the GitHub release from the changelog, and calls
# release.yml to check and publish the image.
#
# Config: release-please-config.json and .release-please-manifest.json. Pre-1.0,
# feat and fix both bump the patch (0.6.2 -> 0.6.3); moving to the next milestone
# line takes a `Release-As: 0.7.0` footer (docs/operations.md, Releasing).
#
# Tokens: release-please uses the GITHUB_TOKEN. A tag that token creates starts no
# workflow, so release.yml is called here (workflow_call) rather than on the tag
# push: no PAT or App key with write access to this repo exists anywhere. The same
# rule means the release PR, opened by that token, starts no CI of its own, so the
# release-pr job dispatches it; release.yml still runs make check on the tagged
# commit before anything is published. The Docker Hub secrets live in the `release`
# environment (main and v* tags only) and are passed to release.yml by name.
#
# Who merges: the maintainer, by hand, after reading the digest (#357). Never
# auto-merge: armed by this workflow, the merge is the GITHUB_TOKEN's push, which
# starts no workflow, so this one never ran on it and 0.7.6 was merged but not
# tagged (#394). A merge by a person starts this workflow as usual.
#
# workflow_dispatch is the way back if a merged release PR was not tagged (its
# label still says `autorelease: pending`): run this workflow on main and
# release-please tags it and releases as on a merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing by default, each job asks for what it uses.
permissions: {}

# One run at a time; a newer push supersedes a queued one, never a running one.
concurrency:
  group: release-please
  cancel-in-progress: false

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release PR's branch, the v* tag and the GitHub release
      pull-requests: write # opens and updates the release PR
      issues: write # the autorelease labels on the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR's digest (#357): one comment, edited in place on every push,
  # listing what changed since the last release tag in the places that need a
  # human look (new dependencies, the lockfiles, workflows and agent policy, build
  # and release files, weakened tests). It runs on every push, not only when the
  # release PR changes: a ci: or chore: commit ships in the release without
  # touching its changelog. It reads git history at main and runs nothing from a
  # PR. It reads git history only; whether to merge is the maintainer's call.
  digest:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the comment on the release PR
    outputs:
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history and tags since the last release
      - name: Find the release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "autorelease: pending" --json number --jq '.[0].number // empty')
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            echo "No open release PR." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Work out the digest
        id: digest
        if: steps.pr.outputs.number != ''
        run: |
          python3 scripts/release_digest.py --github-output > "$RUNNER_TEMP/digest.md"
          cat "$RUNNER_TEMP/digest.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the digest on the release PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # Ours: by this token's bot, starting with release_digest.py's MARKER.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]"
              and (.body | startswith("<!-- release-digest -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F "body=@$RUNNER_TEMP/digest.md" > /dev/null
            echo "Updated the digest on #$PR." >> "$GITHUB_STEP_SUMMARY"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F "body=@$RUNNER_TEMP/digest.md" > /dev/null
            echo "Commented the digest on #$PR." >> "$GITHUB_STEP_SUMMARY"
          fi

  # CI for the release PR. It is made with the GITHUB_TOKEN, so no CI starts on
  # it and its required checks would never report. A dispatch is the one event
  # that token may start: run CI on the release branch when release-please
  # changed it. Auto-merge stays off (see "Who merges" above); an earlier run's,
  # if any is still armed, is turned off.
  release-pr:
    needs: [release-please, digest]
    if: needs.digest.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # turns off auto-merge left on by an earlier run
      actions: write # dispatches CI on the release branch
    steps:
      - name: CI on the release branch
        if: needs.release-please.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.release-please.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<<"$PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
      - name: Auto-merge off
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.digest.outputs.pr }}
        run: |
          armed=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$armed" = "true" ]; then
            gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
          echo "#$NUMBER waits for a maintainer to merge it." >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The most a called workflow's jobs can have: release.yml's publish job uses
    # id-token and attestations to attest the images (#356); its check job asks
    # for contents: read only.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # The workspace-relative form: actionlint (1.7.12) rejects the newer `$/` one.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # A called workflow sees a secret only if the caller passes it, even when the
    # called job names the environment that holds it (GitHub's reusing-workflows
    # docs). Passing them by name is enough: publish's `environment: release`
    # supplies the values, which exist only there (main and v* tags). Without this
    # they were empty and 0.7.4 published nothing.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
