version: 2
updates:
  # The SHA-pinned actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Python dependencies: uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
  # The base images in the Dockerfile are pinned by digest; this bumps them.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
