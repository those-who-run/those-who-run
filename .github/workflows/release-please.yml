name: Release PR

# Merged PRs collect in one release PR, `chore(release): x.y.z`, that release-please
# keeps up to date on every push to main: the next version, CHANGELOG.md, and the
# version strings in src/those_who_run/__init__.py and the docs. This workflow runs
# CI on it and turns on auto-merge; the main ruleset needs a human approval for a
# bot-authored change, so the maintainer's approval is the decision to ship, and the
# PR merges itself once CI is green. Close or edit it to hold a release back. The
# next run tags the merge commit vx.y.z, creates the GitHub release from the
# changelog, and calls release.yml to check and publish the image.
#
# Config: release-please-config.json and .release-please-manifest.json. Pre-1.0,
# feat and fix both bump the patch (0.6.2 -> 0.6.3); moving to the next milestone
# line takes a `Release-As: 0.7.0` footer (docs/operations.md, Releasing).
#
# Tokens: release-please uses the GITHUB_TOKEN. A tag that token creates starts no
# workflow, so release.yml is called here (workflow_call) rather than on the tag
# push: no PAT or App key with write access to this repo exists anywhere. The same
# rule means the release PR, opened by that token, starts no CI of its own, so the
# job below dispatches it. The Docker Hub secrets live in the `release` environment
# (main and v* tags only) and are passed to release.yml by name.
on:
  push:
    branches: [main]

# Least privilege: nothing by default, each job asks for what it uses.
permissions: {}

# One run at a time; a newer push supersedes a queued one, never a running one.
concurrency:
  group: release-please
  cancel-in-progress: false

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release PR's branch, the v* tag and the GitHub release
      pull-requests: write # opens and updates the release PR, and turns on its auto-merge
      issues: write # the autorelease labels on the release PR
      actions: write # dispatches CI on the release branch
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR is made with the GITHUB_TOKEN, so no CI starts on it and its
      # required checks would never report. A dispatch is the one event that token
      # may start: run CI on the release branch, and merge the PR when it passes.
      # Merging it is the release, so a release ships once CI is green; close or
      # edit the PR to hold one back.
      - name: CI and auto-merge for the release PR
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<<"$PR")
          number=$(jq -r '.number' <<<"$PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash

  # The release PR's digest (#357): one comment, edited in place on every push,
  # listing what changed since the last tag in the places that need a human look
  # (new dependencies, workflows and agent policy, build and release files,
  # weakened tests). It reads git history at main only and runs nothing from a PR.
  digest:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the comment on the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history and tags since the last release
      - name: Comment the digest on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "autorelease: pending" --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          python3 scripts/release_digest.py > "$RUNNER_TEMP/digest.md"
          cat "$RUNNER_TEMP/digest.md" >> "$GITHUB_STEP_SUMMARY"
          # Ours: by this token's bot, starting with release_digest.py's MARKER.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]"
              and (.body | startswith("<!-- release-digest -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F "body=@$RUNNER_TEMP/digest.md" > /dev/null
            echo "Updated the digest on #$pr." >> "$GITHUB_STEP_SUMMARY"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              -F "body=@$RUNNER_TEMP/digest.md" > /dev/null
            echo "Commented the digest on #$pr." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    # The workspace-relative form: actionlint (1.7.12) rejects the newer `$/` one.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # A called workflow sees a secret only if the caller passes it, even when the
    # called job names the environment that holds it (GitHub's reusing-workflows
    # docs). Passing them by name is enough: publish's `environment: release`
    # supplies the values, which exist only there (main and v* tags). Without this
    # they were empty and 0.7.4 published nothing.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
