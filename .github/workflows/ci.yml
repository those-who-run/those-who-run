name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv installs the Python in .python-version and the packages in uv.lock.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
          enable-cache: true
      - run: make venv
      # Node and the Playwright browser for make web-check (ADR 0003 point 5): the
      # Node in web/.node-version, the browser cached by Playwright's version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('./web/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browser
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # The same command as locally: lint, mypy, tests with the coverage floor, and
      # web-check. Tests that replay an archived outing fetch it from the `outings`
      # release with gh (ADR 0002), which needs a token; without one they skip, and
      # a skip fails make check.
      - run: make check
        env:
          GH_TOKEN: ${{ github.token }}
      # The pit wall at 390, 820 and 1440 px wide, for the PR to link.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pitwall-screenshots
          path: web/test-results/screenshots/
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: muldoon/those-who-run:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts and both of its modes parse: what the release checks too.
      - name: Smoke test the image
        run: |
          docker run --rm muldoon/those-who-run:ci --version
          docker run --rm muldoon/those-who-run:ci web --help > /dev/null
      - name: Build the pit wall (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: pitwall
          platforms: linux/amd64
          push: false
          load: true
          tags: muldoon/those-who-run:ci-pitwall
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No engineer packages and no Node; /healthz and the web app answer.
      - name: Smoke test the pit wall image
        run: scripts/smoke-pitwall.sh muldoon/those-who-run:ci-pitwall
