# What each fixture is and what it pins. Every file in this folder is listed
# here, and every entry is a file here: tests/test_fixtures.py fails otherwise.
#
# Fixtures are real drives cut down with `those-who-run thin` (gzipped by
# default) to the frames where something changed, about 2 Hz.
#
#   file      the fixture, a .jsonl.gz in this folder
#   date      the day it was driven
#   track     as the track table names it, or why there is no track
#   car       as the car table names it, or why there is no car
#   kind      session kind and start type (sessionkind.py), one per session
#   outing    the NUC outing it was cut from (GT7_RECORD_DIR file name without
#             .jsonl.gz, UTC), or null when it was not recorded on the NUC or
#             the outing was pruned before its id was noted
#   source    where it came from and which part was kept
#   pins      the behaviours the tests check against it
#   tests     the test modules that read it

fixtures:
  - file: real-race-2laps-2026-10-14.jsonl.gz
    date: 2026-10-14
    track: none in the frames (recorded before track ids were kept)
    car: none in the frames (recorded before car codes were kept)
    kind: [solo_timed (flying), lap_race (rolling)]
    outing: null
    source: >-
      The first recording, made with `record` on a laptop: practice laps, then
      a two-lap race. Thinned at one frame a second.
    pins:
      - The phases cover the whole session, menu to results screen.
      - A two-lap race from P10 to P6, the flag at "lap 3 of 2", and the replay
        blip GT7 sends after the results.
      - Callouts and stored sessions for practice followed by a race.
      - The stored best lap matches the results card.
      - A replay writes its sessions to a store of its own, never the live one.
    tests: [test_best_lap_stored, test_real_recording, test_replay_store]

  - file: real-quali-restart-quit-2026-10-14.jsonl.gz
    date: 2026-10-14
    track: Nurburgring 24h
    car: Hyundai Genesis Gr.3
    kind: [timed_field (flying), timed_field (flying)]
    outing: null
    source: Recorded with `record` on a laptop, a qualifying session.
    pins:
      - A restart goes straight back to lap 1 and ends the session as a restart.
      - Leaving through the menu is a quit, and keeps the last position.
      - Pausing and resuming three times mid-lap is neither a start nor an end.
      - Qualifying reads as a timed field.
    tests: [test_real_recording, test_recordtools, test_results, test_sessionkind]

  - file: real-n24h-race-lap1-positions-2026-10-14.jsonl.gz
    date: 2026-10-14
    track: Nurburgring 24h
    car: Hyundai Genesis Gr.3
    kind: [lap_race (rolling)]
    outing: null
    source: Recorded with `record` on a laptop, a race through lap 1.
    pins:
      - Track detection is probable before the lights and confirmed after lap 1.
      - The engine records the track in the session, and backfill restores it
        from the stored laps.
      - A lap race with a rolling start.
    tests: [test_tracks, test_sessionkind]

  - file: real-nuc-unknown-track-2026-10-15.jsonl.gz
    date: 2026-10-15
    track: Sportsland SUGO (not in the table when it was cut)
    car: Ferrari F355 Berlinetta '94
    kind: [solo_timed (flying)]
