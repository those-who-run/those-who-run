version: 2
# Groups follow the auto-merge rules (.github/workflows/dependabot-automerge.yml): a
# grouped PR merges only when every update in it is safe, so majors are never grouped
# with the updates that would otherwise merge on their own.
# Commits are `deps: ...`, which release-please lists under "Dependencies" in the
# release PR and the changelog (release-please-config.json).
updates:
  # The SHA-pinned actions in .github/workflows. Minors and patches merge after CI;
  # each major gets its own PR, for review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      actions:
        update-types: [minor, patch]
  # Python dependencies: uv.lock. Patches always merge after CI; minors only when every
  # package in the group is at 1.0 or later (a 0.x minor may break), so they are kept
  # apart. Majors get their own PRs.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      python-patch:
        update-types: [patch]
      python-minor:
        update-types: [minor]
  # The base images in the Dockerfile are pinned by digest; this bumps them. Never
  # auto-merged: a new Python or uv changes the runtime the tests did not run on.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  # The web app's npm packages (web/package-lock.json), pinned exactly. A release
  # must be two weeks old before it is offered. Minors and patches come grouped, as
  # the Actions do, and merge after CI under the same rules (a 0.x minor waits for
  # review); each major gets its own PR.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
    groups:
      web:
        update-types: [minor, patch]
    # TypeScript majors wait until the web app is ready for them (#312).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
