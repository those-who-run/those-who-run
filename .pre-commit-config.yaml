# The checks a commit meets before it is made (#339): `make hooks` installs them,
# CI's `test` job runs them on every file, and .claude/hooks/guard.py stops an agent
# from skipping them. Seconds, not minutes: pytest, mypy, tsc, Vitest and Playwright
# stay in `make check`.
#
# The local hooks run this checkout's own tools (scripts/hook-run.sh), at the versions
# uv.lock and web/package-lock.json pin. The external ones are pinned to a commit SHA,
# the tag in the `frozen:` comment; Dependabot bumps them (.github/dependabot.yml).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]
# Generated or binary files: never edited by hand.
exclude: |
  (?x)^(
    web/openapi\.json
    | web/src/api/schema\.d\.ts
    | CHANGELOG\.md
    | tests/fixtures/.*\.gz
  )$
  | \.(svg|png)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: scripts/hook-run.sh .venv/bin/ruff venv format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: scripts/hook-run.sh .venv/bin/ruff venv check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: eslint
        name: eslint (web/)
        entry: scripts/hook-run.sh web/node_modules/.bin/eslint web-deps --no-warn-ignored
        language: system
        files: ^web/.*\.(js|jsx|ts|tsx|mjs|cjs)$
      - id: openapi
        name: web/openapi.json matches the API's models (make openapi)
        entry: scripts/hook-run.sh .venv/bin/python venv scripts/openapi.py --check
        language: system
        files: ^(src/those_who_run/.*\.py|scripts/openapi\.py|web/openapi\.json)$
        pass_filenames: false
      - id: brand-css
        name: brand.css matches brand.py (make brand-css)
        entry: scripts/hook-run.sh .venv/bin/python venv scripts/brand_css.py --check
        language: system
        files: ^(src/those_who_run/brand\.py|scripts/brand_css\.py|web/src/styles/brand\.css)$
        pass_filenames: false
      - id: api-client
        name: the web client matches web/openapi.json (npm run api)
        entry: >-
          scripts/hook-run.sh web/node_modules/.bin/openapi-typescript web-deps
          web/openapi.json -o web/src/api/schema.d.ts --check
        language: system
        files: ^web/(openapi\.json|src/api/schema\.d\.ts)$
        pass_filenames: false
      - id: uv-lock
        name: uv.lock matches pyproject.toml (make lock)
        entry: scripts/hook-run.sh uv venv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

  # The staged changes, before they are committed. In `--all-files` runs (CI) there
  # is nothing staged, so it scans nothing there.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # The workflows: actionlint for syntax and expressions, zizmor for the security
  # audits that need no network. shellcheck and pyflakes are off, so a run gives the
  # same answer on a laptop without them as in CI.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline, --min-severity=medium]

  # The commit message: a conventional commit with one of release-please's types
  # (release-please-config.json). CI checks a PR's title, the squash commit's
  # subject, with the same hook.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [feat, fix, perf, revert, deps, docs, refactor, test, build, ci, chore, style]
