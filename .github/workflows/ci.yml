name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release-please's PR is made with the GITHUB_TOKEN, which starts no workflows;
  # release-please.yml dispatches this on the release branch instead, so the PR's
  # required checks report.
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the test guard reads the PR's description
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the test guard diffs the PR against its base
      # What the PR changes in uv.lock and web/package-lock.json, from the dependency
      # graph (#355): fails on a known vulnerability of moderate severity or above,
      # or a licence outside this list: the licences GPL-3.0-only can take that the
      # current dependencies use. The fonts (SIL OFL 1.1) and caniuse-lite's data
      # (CC-BY-4.0, build-time only) are allowed by package, not by licence, and so
      # is uri-js (eslint's, via ajv), which the dependency graph reads as
      # BSD-2-Clause AND BSD-2-Clause-Views. Dev packages count too: vite, vitest
      # and the eslint plugins run in CI with a token. New names are gated by
      # tests/test_dependencies.py and docs/dependencies.md.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0,
            GPL-3.0-only, GPL-3.0-or-later, ISC, LGPL-3.0-only, LGPL-3.0-or-later,
            MIT, MIT-0, MPL-2.0, PSF-2.0, Python-2.0, Unlicense, Zlib
          allow-dependencies-licenses: >-
            pkg:npm/%40fontsource/barlow, pkg:npm/%40fontsource/barlow-semi-condensed,
            pkg:npm/caniuse-lite, pkg:npm/uri-js
          show-openssf-scorecard: true
          comment-summary-in-pr: never
      # uv installs the Python in .python-version and the packages in uv.lock.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
          enable-cache: true
      - run: make venv
      # A PR that deletes, skips or loosens tests says why (#358): a line
      # `Tests weakened: <reason>` in its description, read when this runs (so a
      # re-run sees an edit), never interpolated into a shell. Dependabot's PRs
      # don't touch tests. What it finds goes to the job summary either way.
      - name: Weakened tests need a reason
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .venv/bin/python scripts/test_guard.py "$BASE" "$HEAD" --pr "$PR"
      # Node and the Playwright browser for make web-check (ADR 0003 point 5): the
      # Node in web/.node-version, the browser cached by Playwright's version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('./web/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browser
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # The commit hooks (.pre-commit-config.yaml, #339) on every file: what a commit
      # runs locally, so skipping them there gains nothing. Their environments are
      # cached by the config they come from.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Commit hooks
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
      # A squash merge takes the PR title as the commit subject, which no local hook
      # sees: the same commit-msg hook checks it. The title comes in through env:,
      # never expanded into the script.
      - name: PR title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          .venv/bin/pre-commit run conventional-pre-commit --hook-stage commit-msg \
            --commit-msg-filename "$RUNNER_TEMP/pr-title"
      # The same command as locally: lint, mypy, workflow-lint (zizmor and
      # actionlint), tests with the coverage floor, and web-check. Tests that replay
      # an archived outing fetch it from the `outings` release of
      # those-who-run/outings with gh (ADR 0002), which needs a token; without one
      # they skip, and a skip fails make check. The token also turns on zizmor's
      # online audits (impostor commits, known-vulnerable actions).
      - run: make check
        env:
          GH_TOKEN: ${{ github.token }}
      # The pit wall at 390, 820 and 1440 px wide, for the PR to link.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pitwall-screenshots
          path: web/test-results/screenshots/
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: muldoon/those-who-run:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts: what the release checks too.
      - name: Smoke test the image
        run: docker run --rm muldoon/those-who-run:ci --version
      - name: Build the pit wall (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: pitwall
          platforms: linux/amd64
          push: false
          load: true
          tags: muldoon/those-who-run:ci-pitwall
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No engineer packages and no Node; /healthz and the web app answer.
      - name: Smoke test the pit wall image
        run: scripts/smoke-pitwall.sh muldoon/those-who-run:ci-pitwall
      # The old pit wall is gone from both images (#238 AC4), and their sizes go to
      # the summary (#26).
      - name: No web extra in either image
        run: scripts/smoke-no-web-extra.sh muldoon/those-who-run:ci muldoon/those-who-run:ci-pitwall
