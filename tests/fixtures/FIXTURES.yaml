# What each fixture is and what it pins. Every file in this folder is listed
# here, and every entry is a file here: tests/test_fixtures.py fails otherwise.
#
# Fixtures are real drives cut down with `those-who-run thin` (gzipped by
# default) to the frames where something changed, about 2 Hz.
#
#   file      the fixture, a .jsonl.gz in this folder
#   date      the day it was driven
#   track     as the track table names it, or why there is no track
#   car       as the car table names it, or why there is no car
#   kind      session kind and start type (sessionkind.py), one per session
#   outing    the NUC outing it was cut from (GT7_RECORD_DIR file name without
#             .jsonl.gz, UTC), or null when it was not recorded on the NUC or
#             the outing was pruned before its id was noted
#   source    where it came from and which part was kept
#   pins      the behaviours the tests check against it
#   tests     the test modules that read it
#
# `outings` lists the whole outings kept in the archive (docs/adr/0002): the
# `outings` release of this repository, one <id>.jsonl.gz and <id>.json sidecar
# each. `tests/archive.py` fetches one by id (`archived_outing("20261017-162118")`)
# and skips with the reason when it can't. A fixture's `outing` must be listed
# there. `lost` lists outings specs cite that were pruned before they could be
# archived.

