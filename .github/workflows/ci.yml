name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv installs the Python in .python-version and the packages in uv.lock.
      - uses: astral-sh/setup-uv@v10.3.0 # no moving major tag; #164 pins the SHA
        with:
          version: "0.11.23"
          enable-cache: true
      - run: make venv
      # The same command as locally: lint, mypy, and tests with the coverage floor.
      - run: make check

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: muldoon/those-who-run:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
